name: CI/CD — Development Deploy

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: notification-service-develop-deploy
  cancel-in-progress: true

jobs:
  release-development:
    name: Release to Development
    uses: ./.github/workflows/deploy-to-azure.yml
    with:
      environment: development
    secrets: inherit
